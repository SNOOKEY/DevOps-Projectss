apiVersion: apps/v1
kind: Deployment

metadata:
  name: twitter-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: twitter-app

  template:
    metadata:
      labels:
        app: twitter-app

    spec:
      containers:
        - name: twitter-app
          image: snookeyanas/twitter-app:18
          ports:
            - containerPort: 8080